name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (all modules)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Module-agnostic on purpose: `test` resolves in every subproject that
      # defines it, so modules added later are covered without editing this file.
      # (Listing modules by hand is how :feature:viewer's tests went unrun after
      # T10.) These are all local JVM unit tests — no emulator required; the
      # Android modules build against the runner's preinstalled SDK.
      - name: Run unit tests for all modules
        run: ./gradlew test --no-daemon
